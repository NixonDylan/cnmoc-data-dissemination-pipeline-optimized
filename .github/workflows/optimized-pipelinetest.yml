name: CI Data Pipeline Test Suite

# Trigger the test workflow on every push or pull request to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    services:
      # Spin up a transient Redis container automatically to mock the broker environment
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - name: Check out repository code
      uses: actions/checkout@v3

    - name: Set up Python 3.11 Environment
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install System and Python Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libpq-dev
        python -m pip install --upgrade pip
        pip install polars psycopg[pool] pydantic celery redis pytest

    - name: Execute Automated Test Suite via Pytest
      env:
        CELERY_BROKER_URL: redis://localhost:6379/0
        DATABASE_URL: postgresql://mock_user:mock_pass@localhost:5432/mock_db
      run: |
        pytest test_pipeline.py -v
